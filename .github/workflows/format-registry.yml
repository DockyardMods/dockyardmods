name: Format Registry

on:
  workflow_call:
    inputs:
      registry_path:
        required: false
        type: string
        default: ./registry.json
      tooling_ref:
        required: false
        type: string
        default: main
      commit_message:
        required: false
        type: string
        default: Format registry

permissions:
  contents: write

jobs:
  format-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repo
        uses: actions/checkout@v4

      - name: Check out tooling repo
        uses: actions/checkout@v4
        with:
          repository: DockyardMods/dockyardmods
          ref: ${{ inputs.tooling_ref }}
          path: dockyardmods-tooling

      - name: Set up tools with mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          working_directory: dockyardmods-tooling

      - name: Install tooling dependencies
        working-directory: dockyardmods-tooling
        run: pnpm install --frozen-lockfile

      - name: Format registry
        working-directory: dockyardmods-tooling
        env:
          REGISTRY_PATH: ${{ github.workspace }}/${{ inputs.registry_path }}
        run: node packages/scripts/src/format-registry.ts "$REGISTRY_PATH"

      - name: Commit formatted registry
        working-directory: ${{ github.workspace }}
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          REGISTRY_PATH: ${{ inputs.registry_path }}
        run: |
          if git diff --quiet -- "$REGISTRY_PATH"; then
            echo "Registry is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REGISTRY_PATH"
          git commit -m "$COMMIT_MESSAGE"
          git push
