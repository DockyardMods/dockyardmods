name: Validate Manifest

on:
  workflow_call:
    inputs:
      manifest_path:
        required: false
        type: string
        default: ./manifest.yml
      tooling_ref:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repo
        uses: actions/checkout@v4

      - name: Check out tooling repo
        uses: actions/checkout@v4
        with:
          repository: DockyardMods/dockyardmods
          ref: ${{ inputs.tooling_ref }}
          path: dockyardmods-tooling

      - name: Set up tools with mise
        uses: jdx/mise-action@v4
        with:
          cache: true
          working_directory: dockyardmods-tooling

      - name: Install tooling dependencies
        working-directory: dockyardmods-tooling
        run: pnpm install --frozen-lockfile

      - name: Validate manifest
        working-directory: dockyardmods-tooling
        env:
          MANIFEST_PATH: ${{ github.workspace }}/${{ inputs.manifest_path }}
        run: node packages/scripts/src/validate-manifest.ts "$MANIFEST_PATH"
